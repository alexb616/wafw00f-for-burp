plugins {
    id 'java'
}

group = 'com.wafw00f.burp'
version = '0.1.0'

// Montoya API publicado por PortSwigger en Maven Central. Si tu entorno no tiene
// acceso a Maven Central, puedes conmutar a 'compileOnly files("libs/montoya-api-2026.7.jar")'
// y comentar el bloque repositories; el libs/ se mantiene en el repo precisamente
// para ese caso offline.
repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'wafw00f-for-burp'
    manifest {
        attributes('Implementation-Title': 'wafw00f for Burp',
                   'Implementation-Version': project.version)
    }
}
