plugins {
    id 'java'
}

group = 'com.wafw00f.burp'
version = '0.1.0'

// No remote repositories are used: the only external artifact is the Montoya API,
// which is compiled against the local jar in libs/ (and provided by Burp at runtime).
// If your machine has access to Maven Central, you can replace the local dependency
// with:   compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
// adding   repositories { mavenCentral() }.
dependencies {
    compileOnly files('libs/montoya-api-2026.7.jar')
}

java {
    // Java 17 bytecode: loads on the JRE shipped with Burp (17+). Built with JDK 21.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Self-contained JAR with no runtime dependencies (the JSON parser is our own).
// Automatically bundles src/main/resources (signatures.json, wafprio.json).
jar {
    archiveBaseName = 'wafw00f-for-burp'
    manifest {
        attributes('Implementation-Title': 'wafw00f for Burp',
                   'Implementation-Version': project.version)
    }
}
